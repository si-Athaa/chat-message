<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sad Anime Aesthetic - Custom Edition</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --warm-glow: #ffcc33;
            --bg-dark: #020205;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: white;
        }

        /* Container untuk efek Parallax */
        #wallpaper-container {
            position: fixed;
            width: 110vw;
            height: 110vh;
            top: -5vh;
            left: -5vw;
            transition: transform 0.2s ease-out;
            z-index: -1;
        }

        /* Latar Belakang menggunakan file gefex.jpeg */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('gefex.jpeg'); /* Menggunakan file Anda */
            background-size: cover;
            background-position: center;
            opacity: 1;
            transform: scale(1);
        }

        /* Cahaya Lampu yang Berkedip (Disesuaikan dengan posisi lampu di foto) */
        .lamp-glow {
            position: fixed;
            top: 25%;
            left: 22%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 204, 51, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: flicker 5s infinite ease-in-out;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            52% { opacity: 0.8; }
            54% { opacity: 1; }
        }

        /* Lapisan Estetika */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, 
                rgba(2, 2, 5, 0.1) 0%, 
                rgba(2, 2, 10, 0.2) 70%, 
                rgba(5, 5, 20, 0.5) 100%);
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        .grain {
            position: fixed;
            inset: 0;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Grain.png');
            opacity: 0.04;
            pointer-events: none;
            z-index: 2;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* UI Styling */
        .ui-panel {
            position: fixed;
            padding: 3rem;
            z-index: 10;
        }

        .top-left { top: 0; left: 0; }
        .bottom-left { bottom: 0; left: 0; max-width: 500px; }

        #clock {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(to bottom, #fff, var(--warm-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 204, 51, 0.4));
            line-height: 1;
        }

        #date {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-left: 3px solid var(--warm-glow);
            padding: 1.5rem 2rem;
            border-radius: 0 15px 15px 0;
            margin-bottom: 2rem;
        }

        #quote-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            transition: opacity 1s;
        }

        .controls {
            display: flex;
            gap: 1rem;
            pointer-events: auto;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.7rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.4s;
            backdrop-filter: blur(5px);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        button:hover {
            background: rgba(255, 204, 51, 0.2);
            color: white;
            border-color: var(--warm-glow);
            transform: translateY(-3px);
        }

        .audio-wave {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 30px;
            margin-top: 15px;
            opacity: 0.4;
        }

        .bar { width: 2px; background: var(--warm-glow); height: 4px; }
        .playing .bar { animation: wave 0.8s ease-in-out infinite alternate; }
        @keyframes wave { from { height: 4px; } to { height: 30px; } }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="lamp-glow"></div>

    <div id="wallpaper-container">
        <div class="scene"></div>
    </div>

    <div class="vignette"></div>
    <div class="overlay"></div>

    <canvas id="rainCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>

    <div class="ui-panel top-left">
        <div id="clock">00:00</div>
        <div id="date">MEMPROSES...</div>
    </div>

    <div class="ui-panel bottom-left">
        <div class="glass-box">
            <p id="quote-text">“langit malam ini punya cara sendiri untuk bercerita”</p>
        </div>
        <div class="controls">
            <button onclick="toggleMusic()">Music: <span id="music-status">OFF</span></button>
            <button onclick="toggleAnimation()">Rain: ON</button>
        </div>
        <div class="audio-wave" id="visualizer">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <script>
        const rainCanvas = document.getElementById('rainCanvas');
        const partCanvas = document.getElementById('particleCanvas');
        const rainCtx = rainCanvas.getContext('2d');
        const partCtx = partCanvas.getContext('2d');
        const bgMusic = document.getElementById('bgMusic');
        const container = document.getElementById('wallpaper-container');
        
        let rainArray = [];
        let particles = [];
        let animationActive = true;
        
        const quotes = [
            "“langit malam ini punya cara sendiri untuk bercerita”",
            "“kadang yang kita butuhkan hanyalah lampu redup dan suara hujan”",
            "“bunga-bunga ini tetap indah, meski tak ada yang melihat di kegelapan”",
            "“tangga ini menuju ke mana? mungkin ke tempat yang lebih tenang”",
            "“ada damai di antara bayang-bayang pohon malam ini”",
            "“cahaya ini kecil, tapi cukup untuk menuntun jalan pulang”"
        ];

        function initCanvases() {
            rainCanvas.width = partCanvas.width = window.innerWidth;
            rainCanvas.height = partCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', initCanvases);
        initCanvases();

        class RainDrop {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * rainCanvas.width;
                this.y = Math.random() * -rainCanvas.height;
                this.velocity = Math.random() * 12 + 8;
                this.length = Math.random() * 15 + 10;
                this.opacity = Math.random() * 0.12;
            }
            update() {
                this.y += this.velocity;
                if (this.y > rainCanvas.height) this.init();
            }
            draw() {
                rainCtx.beginPath();
                rainCtx.strokeStyle = `rgba(200, 220, 255, ${this.opacity})`;
                rainCtx.moveTo(this.x, this.y);
                rainCtx.lineTo(this.x, this.y + this.length);
                rainCtx.stroke();
            }
        }

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * partCanvas.width;
                this.y = Math.random() * partCanvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = (Math.random() - 0.5) * 0.15;
                this.opacity = Math.random() * 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = partCanvas.width;
                if (this.x > partCanvas.width) this.x = 0;
                if (this.y < 0) this.y = partCanvas.height;
                if (this.y > partCanvas.height) this.y = 0;
            }
            draw() {
                partCtx.beginPath();
                partCtx.fillStyle = `rgba(255, 204, 51, ${this.opacity})`;
                partCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                partCtx.fill();
            }
        }

        function createElements() {
            rainArray = []; particles = [];
            for (let i = 0; i < 80; i++) rainArray.push(new RainDrop());
            for (let i = 0; i < 30; i++) particles.push(new Particle());
        }

        function animate() {
            if (!animationActive) return;
            rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
            partCtx.clearRect(0, 0, partCanvas.width, partCanvas.height);
            rainArray.forEach(drop => { drop.update(); drop.draw(); });
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            container.style.transform = `translate(${-x}px, ${-y}px)`;
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function newQuote() {
            const quoteEl = document.getElementById('quote-text');
            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                quoteEl.style.opacity = 1;
            }, 1000);
        }
        setInterval(newQuote, 15000);

        function toggleMusic() {
            const status = document.getElementById('music-status');
            const vis = document.getElementById('visualizer');
            if (bgMusic.paused) {
                bgMusic.play().catch(() => {});
                status.innerText = "ON";
                vis.classList.add('playing');
            } else {
                bgMusic.pause();
                status.innerText = "OFF";
                vis.classList.remove('playing');
            }
        }

        function toggleAnimation() {
            animationActive = !animationActive;
            event.target.innerText = animationActive ? "Rain: ON" : "Rain: OFF";
            if (animationActive) animate();
        }

        createElements();
        animate();
    </script>
</body>
</html>
